apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentient-viz.fullname" . }}-influxdb
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: influxdb
type: Opaque
stringData:
  admin-user: {{ .Values.influxdb.adminUser | quote }}
  admin-password: {{ .Values.influxdb.adminPassword | quote }}
  admin-token: {{ .Values.influxdb.adminToken | quote }}
