apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentient-viz.fullname" . }}-grafana
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
