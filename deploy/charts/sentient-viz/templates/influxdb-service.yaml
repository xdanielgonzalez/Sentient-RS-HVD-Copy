apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentient-viz.fullname" . }}-influxdb
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: influxdb
spec:
  type: ClusterIP
  selector:
    {{- include "sentient-viz.selectorLabels" (dict "root" . "component" "influxdb") | nindent 4 }}
  ports:
    - name: http
      port: 8086
      targetPort: http
