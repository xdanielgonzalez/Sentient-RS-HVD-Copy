{{- if .Values.tailscale.enabled }}
# The grafana pod's ServiceAccount: the tailscale sidecar (containerboot) persists its node
# state in the <fullname>-tailscale-state Secret (TS_KUBE_SECRET), so it needs create (first
# boot; create cannot be resourceName-scoped) plus name-scoped get/update/patch — same shape as
# .ci/k8s/docs/rbac.yaml. The Role/RoleBinding render only with tailscale.rbac.create: helm
# identities without RBAC-object rights (the viz-uat CI deployer) set it false and the bring-up
# manifest carries them instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentient-viz.fullname" . }}-tailscale
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: tailscale
{{- if .Values.tailscale.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sentient-viz.fullname" . }}-tailscale-state
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: tailscale
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "sentient-viz.fullname" . }}-tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sentient-viz.fullname" . }}-tailscale-state
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: tailscale
subjects:
  - kind: ServiceAccount
    name: {{ include "sentient-viz.fullname" . }}-tailscale
roleRef:
  kind: Role
  name: {{ include "sentient-viz.fullname" . }}-tailscale-state
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
