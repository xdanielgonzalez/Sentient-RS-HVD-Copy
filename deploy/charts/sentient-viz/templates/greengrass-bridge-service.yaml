apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentient-viz.fullname" . }}-greengrass-bridge
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: greengrass-bridge
spec:
  type: ClusterIP
  selector:
    {{- include "sentient-viz.selectorLabels" (dict "root" . "component" "greengrass-bridge") | nindent 4 }}
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
