apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentient-viz.fullname" . }}-app
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    {{- include "sentient-viz.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - name: mqtt
      port: {{ .Values.app.brokerPort }}
      targetPort: mqtt
