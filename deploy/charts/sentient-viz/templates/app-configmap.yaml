apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentient-viz.fullname" . }}-app
  labels:
    {{- include "sentient-viz.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
data:
  # bin-rpi config (deny_unknown_fields — keys must match config/sentient.toml exactly).
  sentient.toml: |
    [device]
    id = {{ .Values.app.deviceId | quote }}

    [serial]
    kind = "rs232"        # pty has no RTS line for rs485 direction control
    port = {{ .Values.app.ptyLink | quote }}
    baud = 19200
    parity = "none"
    stop_bits = 1
    read_timeout_ms = 1000

    [poll]
    dip_addresses = {{ .Values.app.poll.dipAddresses | toJson }}
    interval_ms = {{ .Values.app.poll.intervalMs }}
    fault_every = {{ .Values.app.poll.faultEvery }}

    [broker]
    # 0.0.0.0 so the Telegraf pod can subscribe. Plaintext, no auth — demo stack;
    # see networkPolicy.enabled in values.yaml for the mitigation.
    host = "0.0.0.0"
    port = {{ .Values.app.brokerPort }}

    [publish]
    prefix = "tms"

    [greengrass]
    # Presence of this section activates GreengrassTap: the merged flat legacy JSON that
    # WOULD be bridged out to an AWS IoT Greengrass core is published to
    # telemetry/{device_type}/{device_id} on the embedded broker — the greengrass-bridge
    # (mosquitto) pod pulls that namespace off the device for the Grafana parity view. The
    # host/cert values below are consumed ONLY by `bin-rpi --emit-mosquitto-bridge` (never
    # invoked in this stack): nothing dials this host or opens these files at runtime, so
    # placeholders are fine. DEMO ONLY.
    host = "greengrass-core.invalid"
    cert_file = "/etc/sentient/demo-greengrass-client.crt"
    key_file = "/etc/sentient/demo-greengrass-client.key"
    ca_file = "/etc/sentient/demo-greengrass-ca.crt"
