# greengrass-bridge.conf — the Green Grass Bridge: a mosquitto instance that PULLS the
# Greengrass-bound telemetry off the device, exactly like the on-Pi relay does.
#
# Compose twin of the chart-rendered config (greengrass-bridge-configmap.yaml) — only the
# device-broker address differs (compose service DNS instead of the k8s Service). Keep in
# sync with deploy/charts/sentient-viz.
#
# On the Pi (distro/deploy/mosquitto.conf) mosquitto bridges telemetry/# in from bin-rpi's
# embedded rumqttd and a rendered `connection greengrass-relay` block pushes it out to the
# AWS IoT Greengrass core over mTLS (topic telemetry/# out 1 — mosquitto_bridge.rs). This
# demo instance is that relay MINUS the outbound leg: it carries ONLY the Greengrass-bound
# namespace, so everything on this broker IS "what would be sent to Greengrass" — Telegraf
# subscribes here and Grafana renders it for parity against the device-direct TMS stream.
# (The on-Pi relay also pulls tms/# for the private-cloud leg; deliberately not mirrored —
# it would blur the parity view.)

# Demo listener for Telegraf (plaintext/no-auth like the demo rumqttd broker — compose
# publishes it loopback-only on the host). The on-Pi relay instead runs listener-less
# (unix-socket only); this instance must serve subscribers, that one must not.
listener 1883
allow_anonymous true

# No persistence: nothing on this broker is worth surviving a restart, and the config
# volume is mounted read-only.
persistence false
log_dest stdout

# ---------------------------------------------------------------------------
# The bridge — read the device's embedded rumqttd broker (pull the Greengrass-bound
# namespace off the device). Mirrors Bridge 1 of distro/deploy/mosquitto.conf.
# ---------------------------------------------------------------------------
connection device-broker
address app:1883
# `in` = subscribe (bring device topics into this mosquitto). QoS 1 — same topic/QoS the
# rendered greengrass-relay block bridges out (`topic telemetry/# out 1`).
topic telemetry/# in 1
bridge_protocol_version mqttv311
# rumqttd is not mosquitto: it rejects the private-bridge CONNECT variant (protocol level
# 0x84) that try_private (default true) sends, closing the connection — connect as a plain
# MQTT 3.1.1 client instead.
try_private false
remote_clientid greengrass-bridge
# Demo divergence from the on-Pi relay's `cleansession false`: session persistence buys
# nothing here (Telegraf re-reads live data; persistence is off anyway).
cleansession true
# Publish the bridge's connection state ONLY on this local broker (retained "1"/"0" at the
# pinned topic below) — never onto the device's rumqttd. Telegraf turns it into the
# greengrass_bridge_state measurement for the dashboard's "bridge up" stat.
notifications_local_only true
notification_topic $SYS/broker/connection/device-broker/state
