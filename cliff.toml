# git-cliff ~ configuration file for sentient-rs
# https://git-cliff.org/docs/configuration
#
# Tuned to this repo's actual commit history: PRs are squash-merged, so the commit *subject* is
# the PR title. Prefixes seen in history are a mix of strict Conventional Commits (feat, fix, ci,
# chore, docs, style, refactor, chore(deps) from Dependabot) and repo-local module/scope prefixes
# that predate a hard convention (security, link, net, mapping, io, parse, mqtt, channel, app,
# workspace, wolfcrypt, zephyr, harden(zephyr), deploy) plus a few free-form headers with no
# `type:` prefix at all (e.g. "Pipeline hardening: ...", "rename sentient-net -> lib-mqtt").
#
# conventional_commits stays on (gives `!`-breaking detection and scope extraction for commits
# that follow the convention), but filter_unconventional/require_conventional are OFF so a
# non-conventional header is never silently dropped — it falls through to "Other" instead of
# vanishing.

[changelog]
header = """
# Changelog

All notable changes to sentient-rs. Generated by [git-cliff](https://git-cliff.org) from \
squash-merge PR titles (the commit subject *is* the PR title in this repo).

"""
# A Tera template rendered for each release. See https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
    {% endfor %}
{% endfor %}\
{% if version and previous.version %}
[{{ version | trim_start_matches(pat="v") }}]: https://github.com/High-Velocity-Decisions/sentient-rs/compare/{{ previous.version }}...{{ version }}
{% endif %}\
"""
# Remove leading/trailing whitespace from each rendered body.
trim = true
# Render body even when there are no releases to process (keeps `--unreleased` runs well-formed).
render_always = true
postprocessors = []
footer = ""

[git]
# Parse commits per Conventional Commits for the ones that follow it (scope + `!`-breaking); a
# commit that doesn't parse just keeps its raw message and falls through the parsers below.
conventional_commits = true
filter_unconventional = false
require_conventional = false
protect_breaking_commits = false
split_commits = false

# Squash-merge commits carry the full PR body (often several paragraphs, sometimes the individual
# sub-commit messages) below the subject line. The changelog only ever wants the subject — drop
# everything from the first newline on, THEN link the trailing "(#123)" PR reference (this must run
# after truncation: `$` needs to land at the true end of a now-single-line message to match).
commit_preprocessors = [
  { pattern = '(?s)\r?\n.*', replace = "" },
  { pattern = '\(#([0-9]+)\)$', replace = "([#${1}](https://github.com/High-Velocity-Decisions/sentient-rs/pull/${1}))" },
]

# Assigns each commit to exactly one changelog group. Order matters — first match wins. Security
# is checked FIRST, ahead of feat/fix/module-scope buckets, so a security-relevant change is
# always surfaced in its own section even when it also carries a `feat(...)` or module prefix —
# this is a safety-critical repo and reviewers scan Security first.
commit_parsers = [
  # --- skip noise -------------------------------------------------------------------------------
  { message = "^[Mm]erge (pull request|branch)", skip = true },
  { message = "^chore\\(release\\)", skip = true },

  # --- Security (own section, checked first) ----------------------------------------------------
  { message = "^security", group = "<!-- 0 -->Security" },
  { message = "^wolfcrypt", group = "<!-- 0 -->Security" },
  { message = "^harden(\\(.*\\))?:", group = "<!-- 0 -->Security" },
  { message = "(?i)^[a-zA-Z]+(\\([a-zA-Z0-9_.,-]+\\))?!?:.*\\b(security|crypto|wolfcrypt|tls|auth(entication|orization)?|keystore|tokenverifier|token.verifier|cve|vulnerab\\w*)\\b", group = "<!-- 0 -->Security" },

  # --- Conventional types -------------------------------------------------------------------------
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },

  # --- Dependencies (Dependabot chore(deps) — collapsed, kept apart from hand-written CI work) ---
  { message = "^chore\\(deps", group = "<!-- 3 -->Dependencies" },

  # --- CI & Build ----------------------------------------------------------------------------------
  { message = "^ci(\\(.*\\))?:", group = "<!-- 4 -->CI & Build" },
  { message = "^build(\\(.*\\))?:", group = "<!-- 4 -->CI & Build" },

  # --- Documentation ---------------------------------------------------------------------------------
  { message = "^docs?(\\(.*\\))?:", group = "<!-- 5 -->Documentation" },

  # --- Testing -----------------------------------------------------------------------------------------
  { message = "^test(\\(.*\\))?:", group = "<!-- 6 -->Testing" },
  { message = "^TDD-RED", group = "<!-- 6 -->Testing" },

  # --- Refactor & Maintenance: explicit conventional types, plus this repo's pre-convention
  #     module/scope prefixes for mechanical or structural work (mapping, link, net, io, parse,
  #     mqtt, channel, app, workspace, zephyr, deploy) and bare `chore` --------------------------
  { message = "^refactor(\\(.*\\))?:", group = "<!-- 7 -->Refactor & Maintenance" },
  { message = "^style(\\(.*\\))?:", group = "<!-- 7 -->Refactor & Maintenance" },
  { message = "^chore(\\(.*\\))?:", group = "<!-- 7 -->Refactor & Maintenance" },
  { message = "^(mapping|link|net|io|parse|mqtt|channel|app|workspace|zephyr|deploy)(\\(.*\\))?:", group = "<!-- 7 -->Refactor & Maintenance" },

  # --- Reverts -------------------------------------------------------------------------------------------
  { message = "^revert", group = "<!-- 8 -->Reverts" },

  # --- Everything else: free-form headers with no `type:` prefix (e.g. "Pipeline hardening: ...",
  #     "rename sentient-net -> lib-mqtt (...)") --------------------------------------------
  { message = ".*", group = "<!-- 9 -->Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
# Oldest-first within a release reads like a narrative of the work, matching PR merge order.
sort_commits = "oldest"
recurse_submodules = false
