name: Setup k8s tools
description: >-
  Install pinned, sha256-verified kubectl and/or helm into RUNNER_TEMP (non-root runners cannot
  write /usr/local/bin — learned in #298). Dedupe of the identical install blocks that lived in
  uat.yml's viz-uat job and ci.yml's viz-lint job. Binaries land at $RUNNER_TEMP/kubectl and
  $RUNNER_TEMP/helm — callers invoke them from there (RUNNER_TEMP is not on PATH by design, so
  scripts stay explicit about which binary they run).

inputs:
  kubectl-version:
    description: kubectl version to install (e.g. v1.33.0). Empty = skip kubectl.
    required: false
    default: ""
  helm-version:
    description: helm version to install (e.g. v3.17.0). Empty = skip helm.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install pinned kubectl
      if: inputs.kubectl-version != ''
      shell: bash
      env:
        KUBECTL_VERSION: ${{ inputs.kubectl-version }}
      run: |
        set -euo pipefail
        curl -fsSLo "$RUNNER_TEMP/kubectl.dl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        curl -fsSLo "$RUNNER_TEMP/kubectl.sha256" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
        echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/kubectl.dl" | sha256sum --check --quiet
        install -m 755 "$RUNNER_TEMP/kubectl.dl" "$RUNNER_TEMP/kubectl"

    - name: Install pinned helm
      if: inputs.helm-version != ''
      shell: bash
      env:
        HELM_VERSION: ${{ inputs.helm-version }}
      run: |
        set -euo pipefail
        curl -fsSLo "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
        curl -fsSLo "$RUNNER_TEMP/helm.sha" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
        (cd "$RUNNER_TEMP" && sed 's|  .*|  helm.tgz|' helm.sha | sha256sum --check --quiet)
        tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" --strip-components=1 linux-amd64/helm
