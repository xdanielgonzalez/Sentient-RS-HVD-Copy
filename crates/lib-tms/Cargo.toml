[package]
publish = false            # proprietary — never publish to a public registry
name = "lib-tms"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The PURE, 100%-generated MIL-STD-3071 (TMS) model: concrete Rust structs + enums (one per IDL type) with serde derives, the IDL typedefs (Identity/String32/…), a TmsTopic trait, a 1-byte TmsTopicId topic index, the topic-name/version/bound consts, and a host-only TmsMessage serde dispatch factory. src/generated.rs is GENERATED by tools/tms-idl-codegen from the standard IDL. Deps: heapless + serde only (+ serde_json for the std decode factory). no_std/no-alloc core builds for the MCU. Sibling of lib-canonical — neither depends on the other; the canonical->wire encoders live in lib-mapping, so this crate has NO canonical or JsonSink dependency (that is what dissolves the layering cycle)."

[features]
default = []
# Host-only serde `TmsMessage::{decode,encode}` factory: JSON parse/print needs alloc + serde_json.
# The concrete types + TmsTopic + TmsTopicId no_std core pulls in NOTHING of this and is all the MCU
# ever compiles.
std = ["dep:serde_json", "serde/std"]

[dependencies]
# Concrete types: bounded heapless collections + serde derives. That is the WHOLE production
# dependency surface (heapless + serde) — NO canonical, NO JsonSink, NO encoders. Shedding the
# canonical + lib-mapping deps (the encoders left for lib-mapping) is what makes the graph acyclic.
heapless = { workspace = true, features = ["serde"] }
serde = { workspace = true }
# Host-only (`std`): the serde JSON factory codec.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# The generated types are exercised through the exact on-device encoder (serde-json-core, f32
# NaN -> null) in the frozen-spelling + convergence proofs.
serde-json-core = { workspace = true }
serde = { workspace = true }
heapless = { workspace = true, features = ["serde"] }

[lints]
workspace = true
