# mosquitto.conf — relay bridge for the Sentient METEOR comms module.
#
# The `bin-rpi` binary embeds an rumqttd MQTT server that hosts this device's TMS data on
# 127.0.0.1:1883. This mosquitto instance is the RELAY: it connects to that embedded broker,
# SUBSCRIBES to the TMS topics (reads from the device), and bridges them out to the private-cloud
# endpoint. mosquitto reads from us; the device never pushes to the cloud itself.
#
# mosquitto 2.x does NOT expand ${...} environment variables inside its own config, so a static file
# with placeholders can never actually be filled in by mosquitto itself. This file therefore has NO
# cloud credentials or endpoint in it at all. Instead `bin-rpi --emit-mosquitto-bridge` renders
# the real `connection cloud-relay` block from the figment `[cloud]` config (host/port/username/
# ca_file/topic) plus the `CLOUD_MQTT_PASS` secret env var into a file under the directory named by
# `include_dir` below, before mosquitto (re)starts — see `distro/deploy/mosquitto-override.conf` for the
# systemd wiring and docs/deployment.md §5 for the full runbook. A local-only device (no [cloud]
# config) renders nothing there, and this file still parses and runs fine on its own.

# Scope bridge vs. listener auth independently.
per_listener_settings true

# ---------------------------------------------------------------------------
# NO network listener — mosquitto is a pure outbound RELAY here, never a server.
#
# A `listener` directive is still REQUIRED: mosquitto 2.0+ opens a DEFAULT localhost:1883
# listener when none is configured, which collides with bin-rpi's embedded rumqttd device
# broker on 1883 (EADDRINUSE — breaks the device broker AND this relay). A UNIX-socket
# listener (port 0 + a path) suppresses that default WITHOUT opening any TCP port, so this
# host exposes zero inbound MQTT surface. Nothing connects to the socket; it exists only to
# keep mosquitto off 1883. Ensure /run/mosquitto exists + is mosquitto-owned via
# `RuntimeDirectory=mosquitto` in mosquitto-override.conf. For a deliberate on-device debug
# subscriber, add a loopback-only `listener 1884 127.0.0.1` + `allow_anonymous false`
# per-deployment — never a listener on 1883, and never anonymous-open.
# ---------------------------------------------------------------------------
listener 0 /run/mosquitto/mosquitto.sock
allow_anonymous false

# ---------------------------------------------------------------------------
# Bridge 1 — read the device's embedded rumqttd broker (pull TMS off the device).
# ---------------------------------------------------------------------------
connection device-broker
address 127.0.0.1:1883
# `in` = subscribe (bring device topics into this mosquitto). QoS 1.
topic tms/# in 1
# merged flat legacy telemetry for AWS Greengrass backwards-compat (Scope D, #269) — GreengrassTap
# publishes to telemetry/{device_type}/{device_id}; Bridge 3 relays this namespace out.
topic telemetry/# in 1
cleansession false
bridge_protocol_version mqttv311
# REQUIRED against rumqttd: try_private defaults to TRUE, which marks the CONNECT as a
# mosquitto private bridge (protocol level 4|0x80 = 0x84). rumqttd 0.19 requires exactly 4
# (src/protocol/v4/connect.rs) and drops the connection WITHOUT a CONNACK, so mosquitto's
# automatic try_private fallback (which needs CONNACK rc=1 "unacceptable protocol version")
# never triggers — the bridge retry-loops forever and no device topic is ever pulled.
# Connect as a plain MQTT 3.1.1 client instead. (Distinct from the cloud-relay TODO's
# `try_private true`: that leg is mosquitto→mosquitto, where private mode is correct.)
try_private false

# ---------------------------------------------------------------------------
# Bridge 2 — relay to the private-cloud MQTT endpoint (push what we pulled).
#
# RENDERED, not static: `bin-rpi --emit-mosquitto-bridge` writes the real `connection
# cloud-relay` block (real host/port/username/topic/cafile from the figment [cloud] config, and the
# real password from the CLOUD_MQTT_PASS secret) into /etc/sentient/mosquitto.d/ as an ExecStartPre
# before mosquitto starts. On a local-only device (no [cloud] config) nothing is written there.
#
# The `include_dir /etc/sentient/mosquitto.d` that loads it must go in the MAIN
# /etc/mosquitto/mosquitto.conf, NOT here: this file is installed as
# /etc/mosquitto/conf.d/sentient.conf (loaded via the main config's include_dir), and mosquitto
# 2.x forbids a NESTED include_dir ("Error: The include_dir option is only valid in the main
# configuration file" -> crash-loop). Manual-deploy runbook (docs/deployment.md §5): add
#   include_dir /etc/sentient/mosquitto.d
# to /etc/mosquitto/mosquitto.conf. (The Yocto image does this in mosquitto_%.bbappend.)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Bridge 3 (optional) — AWS IoT Greengrass backwards-compat: relay legacy topics (Scope D, closes
# #52-#54).
#
# RENDERED, not static — same treatment as Bridge 2, given the same real render, not
# ${...} placeholders: `bin-rpi --emit-mosquitto-bridge` calls
# `crate::mosquitto_bridge::render_greengrass_bridge` (crates/bin/rpi/src/mosquitto_bridge.rs),
# which renders the real `connection greengrass-relay` block (host/port/topic/qos from the figment
# [greengrass] config, cert/key/CA file *paths* — mTLS, not a username/password, so unlike Bridge
# 2 there is no secret env var to read) into a file under the `include_dir` named above (e.g.
# /etc/sentient/mosquitto.d/greengrass-relay.conf), before mosquitto (re)starts. On a device with
# no [greengrass] config (the common case — Scope D is opt-in) nothing is written there, and this
# file still parses and runs fine without it.
#
# `GreengrassTap` (impl-app's `host` module) publishes the merged flat legacy JSON this bridge
# relays onto `telemetry/{device_type}/{device_id}` on the embedded broker; Bridge 1 above already
# pulls `telemetry/#` in alongside `tms/#`.
# ---------------------------------------------------------------------------
