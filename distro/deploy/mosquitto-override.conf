# systemd drop-in override for the system `mosquitto.service` package unit.
#
# Wires `bin-rpi --emit-mosquitto-bridge` in as an ExecStartPre so the cloud-relay bridge
# fragment is always freshly rendered — from the figment [cloud] config + the CLOUD_MQTT_PASS
# secret — before mosquitto (re)starts. See distro/deploy/mosquitto.conf's header and docs/deployment.md
# §5 for the full picture; mosquitto 2.x cannot expand ${...} itself, so this render step is the
# only thing that ever puts real credentials into a mosquitto config file.
#
# Install:
#   sudo mkdir -p /etc/sentient/mosquitto.d
#   sudo chown mosquitto:mosquitto /etc/sentient/mosquitto.d && sudo chmod 0750 /etc/sentient/mosquitto.d
#   sudo install -D -m0644 distro/deploy/mosquitto.conf          /etc/mosquitto/conf.d/sentient.conf
#   sudo install -D -m0644 distro/deploy/mosquitto-override.conf /etc/systemd/system/mosquitto.service.d/override.conf
#   sudo install -o mosquitto -g mosquitto -m0600 /path/to/real/cloud.env /etc/sentient/cloud.env
#   sudo systemctl daemon-reload && sudo systemctl restart mosquitto
#
# `/etc/sentient/cloud.env` (see distro/deploy/cloud.env.example) holds ONLY the CLOUD_MQTT_PASS secret —
# never commit the real file. It must be readable by whichever user mosquitto.service's
# ExecStartPre runs as (the render step itself needs the same read access, plus write access to
# /etc/sentient/mosquitto.d — hence chown mosquitto:mosquitto above rather than root-only).
[Service]
# Guarantee /run/mosquitto exists (writable, mosquitto-owned) for the listener-suppressing
# UNIX socket in mosquitto.conf (`listener 0 /run/mosquitto/mosquitto.sock`) — this keeps
# mosquitto off the default TCP 1883 so bin-rpi's rumqttd device broker owns it. /run is a
# tmpfs; idempotent if the packaged unit already declares it.
RuntimeDirectory=mosquitto
# `-` prefix: the file is OPTIONAL. A local-only device (no [cloud] config at all) need not have
# this file; the render step still runs and simply emits nothing (see docs/deployment.md §9).
EnvironmentFile=-/etc/sentient/cloud.env
Environment=SENTIENT_CONFIG=/etc/sentient/sentient.toml
# Fail closed: if [cloud] IS configured but CLOUD_MQTT_PASS is missing/empty, this exits non-zero
# and mosquitto does NOT start — a bridge is never emitted with an empty credential.
ExecStartPre=/usr/local/bin/bin-rpi --emit-mosquitto-bridge /etc/sentient/mosquitto.d/cloud-relay.conf
