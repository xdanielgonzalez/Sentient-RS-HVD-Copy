# systemd drop-in for the packaged mosquitto.service, installed by mosquitto_%.bbappend to
# ${systemd_system_unitdir}/mosquitto.service.d/override.conf. Yocto-image counterpart of
# distro/deploy/mosquitto-override.conf — see docs/deployment.md §5 for the full runbook.
#
# Wires `bin-rpi --emit-mosquitto-bridge` in as an ExecStartPre so the cloud-relay bridge
# fragment (/etc/sentient/mosquitto.d/cloud-relay.conf) is always freshly rendered — from
# the device's [cloud] TOML config + the CLOUD_MQTT_PASS secret — before mosquitto
# (re)starts. mosquitto 2.x cannot expand ${...} itself, so this render step is the only
# thing that ever puts real credentials into a mosquitto config file on this image.
[Service]
# Guarantee /run/mosquitto exists — writable and owned by the mosquitto service user —
# before ExecStartPre/ExecStart. conf.d/sentient.conf binds its listener-suppressing UNIX
# socket there (`listener 0 /run/mosquitto/mosquitto.sock`), which is what keeps mosquitto
# OFF the default TCP 1883 so bin-rpi's embedded rumqttd device broker can own 1883. /run is
# a tmpfs, so this works under the read-only rootfs; idempotent if the packaged unit already
# declares it. See conf.d/sentient.conf's listener comment for the full rationale.
RuntimeDirectory=mosquitto
# `-` prefix: the file is OPTIONAL. A local-only device (no [cloud] config at all) need
# not have this file; the render step still runs and simply emits nothing.
EnvironmentFile=-/etc/sentient/cloud.env
Environment=SENTIENT_CONFIG=/etc/sentient/sentient.toml
# Fail closed: if [cloud] IS configured but CLOUD_MQTT_PASS is missing/empty, this exits
# non-zero and mosquitto does NOT start — a bridge is never emitted with an empty
# credential (see crates/bin/rpi/src/mosquitto_bridge.rs::render_bridge).
ExecStartPre=/usr/bin/bin-rpi --emit-mosquitto-bridge /etc/sentient/mosquitto.d/cloud-relay.conf

# TODO(verify-at-build): confirm /etc/sentient/mosquitto.d ownership on the built image —
# it must be writable by whichever user this ExecStartPre runs as (mosquitto.service's
# default User=mosquitto unless overridden). mosquitto_%.bbappend's do_install creates the
# directory but does not chown it away from root; if the packaged mosquitto.service does
# not run this ExecStartPre as root, add a `chown mosquitto:mosquitto` step (matching
# distro/deploy/mosquitto-override.conf's manual-deploy instructions) via a postinst or an
# additional do_install ownership fixup here.
