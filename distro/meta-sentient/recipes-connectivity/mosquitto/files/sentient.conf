# sentient.conf — mosquitto config fragment for the Yocto image, installed to
# /etc/mosquitto/conf.d/sentient.conf by mosquitto_%.bbappend. This is the packaged
# counterpart of distro/deploy/mosquitto.conf; keep the two in sync if the runtime bridge model
# changes (docs/deployment.md §5 is the single narrative source of truth).
#
# The bin-rpi binary embeds an rumqttd MQTT server hosting this device's TMS data on
# 127.0.0.1:1883. This mosquitto instance is the RELAY: it connects to that embedded
# broker, SUBSCRIBES to the TMS topics (reads from the device), and bridges them out to
# the private-cloud endpoint over TLS. mosquitto reads FROM the device; the device never
# pushes to the cloud itself.
#
# mosquitto 2.x does NOT expand ${...} environment variables inside its own config, so a
# static file with placeholders could never be filled in by mosquitto itself. This file
# therefore carries NO cloud credentials or endpoint. Instead `bin-rpi
# --emit-mosquitto-bridge` renders the real `connection cloud-relay` block (host/port/
# username/ca_file/topic from the device's [cloud] TOML config, password from the
# CLOUD_MQTT_PASS secret env var) into the directory named by include_dir below, as an
# ExecStartPre wired by the mosquitto-override.conf systemd drop-in — before mosquitto
# (re)starts.

# Scope bridge vs. listener auth independently.
per_listener_settings true

# ---------------------------------------------------------------------------
# NO network listener — mosquitto is a pure outbound RELAY here, never a server.
#
# CRITICAL (learned at build/boot, UAT run 29430960362): simply OMITTING every `listener`
# directive does NOT give a listener-less broker on mosquitto 2.x. When no `listener` is
# configured, mosquitto 2.0+ falls back to a DEFAULT listener on localhost:1883 ("Starting
# in local only mode" in the journal) — which then COLLIDES with bin-rpi's embedded rumqttd
# device broker on 1883: rumqttd's TCP listener dies with EADDRINUSE, so the device broker
# has no network-facing socket at all and this bridge's `connection device-broker` (below)
# has nothing healthy to read. mosquitto squatting 1883 breaks BOTH the device broker and
# the cloud relay on every real boot, not just the e2e.
#
# A UNIX-DOMAIN-SOCKET listener (port 0 + a filesystem path) IS a real `listener` directive,
# so it suppresses that default-1883 fallback — while opening ZERO TCP ports. This image
# therefore exposes no inbound MQTT surface whatsoever; bin-rpi's rumqttd owns 1883, and the
# only network-facing MQTT is the outbound cloud bridge (Bridge 2). Nothing ever connects to
# this socket — it exists solely to keep mosquitto off 1883. /run/mosquitto is created,
# writable, and owned by the mosquitto service user via `RuntimeDirectory=mosquitto` in the
# mosquitto-override.conf drop-in (systemd sets it up before ExecStartPre/ExecStart), which
# also survives the read-only rootfs (/run is a tmpfs).
# ---------------------------------------------------------------------------
listener 0 /run/mosquitto/mosquitto.sock
allow_anonymous false

# ---------------------------------------------------------------------------
# Bridge 1 — read the device's embedded rumqttd broker (pull TMS off the device).
# Loopback-to-loopback: both endpoints are on-device, so TLS is not required for this hop.
# ---------------------------------------------------------------------------
connection device-broker
address 127.0.0.1:1883
# `in` = subscribe (bring device topics into this mosquitto). QoS 1.
topic tms/# in 1
# merged flat legacy telemetry for AWS Greengrass backwards-compat (Scope D, #269) — GreengrassTap
# publishes to telemetry/{device_type}/{device_id}; the rendered greengrass-relay bridge relays
# this namespace out. Was present in distro/deploy/mosquitto.conf but missing here (sync drift):
# without it, a device with [greengrass] configured relays nothing.
topic telemetry/# in 1
cleansession false
bridge_protocol_version mqttv311
# REQUIRED against rumqttd: try_private defaults to TRUE, which marks the CONNECT as a
# mosquitto private bridge (protocol level 4|0x80 = 0x84). rumqttd 0.19 requires exactly 4
# (src/protocol/v4/connect.rs) and drops the connection WITHOUT a CONNACK, so mosquitto's
# automatic try_private fallback (which needs CONNACK rc=1 "unacceptable protocol version")
# never triggers — the bridge retry-loops forever and no device topic is ever pulled.
# Connect as a plain MQTT 3.1.1 client instead. (Distinct from the cloud-relay TODO's
# `try_private true` below: that leg is mosquitto→mosquitto, where private mode is correct.)
try_private false

# ---------------------------------------------------------------------------
# Bridge 2 — relay to the private-cloud MQTT endpoint (push what we pulled).
#
# RENDERED, not static: see header comment. bin-rpi --emit-mosquitto-bridge writes the real
# `connection cloud-relay` block into /etc/sentient/mosquitto.d/ at ExecStartPre. On a
# local-only device (no [cloud] config) nothing is written there and there is simply no
# cloud relay — mosquitto still starts fine.
#
# CRITICAL (UAT run 29434470958): the `include_dir /etc/sentient/mosquitto.d` that loads that
# rendered block must NOT live in THIS file. mosquitto 2.x rejects `include_dir` inside any
# file that is itself loaded via include_dir ("Error: The include_dir option is only valid in
# the main configuration file") — this file IS loaded that way (main mosquitto.conf ->
# include_dir /etc/mosquitto/conf.d -> here), so a nested include_dir crash-loops mosquitto,
# killing the whole relay. The cloud-relay include therefore lives in the MAIN mosquitto.conf
# (added alongside the conf.d include by mosquitto_%.bbappend's do_install), NOT here.
#
# Hardening requirements enforced by the render step (bin-rpi's mosquitto_bridge.rs as of
# this writing): bridge_insecure false (hostname verification ON, never disabled) and a
# single bridge_cafile (certificate pinning).
#
# TODO(verify-at-build): the plan's verified-facts list additionally calls for
# `bridge_tls_version tlsv1.2` (minimum TLS version pin) and `try_private true` on the
# cloud-relay bridge; bin-rpi's current render_bridge() (crates/bin/rpi/src/
# mosquitto_bridge.rs) does not yet emit either directive. Add them to render_bridge() (keeps
# the single-source-of-truth render path authoritative) — the fix belongs in the Rust renderer.
