# meta-sentient — the Sentient METEOR Yocto layer.
#
# Provides: the `sentient` custom DISTRO (conf/distro/sentient.conf), the sentient-agent
# prebuilt-binary recipe + hardened systemd unit, the sentient-image image recipe, and the
# mosquitto TLS-bridge configuration. Consumes MACHINEs from meta-raspberrypi
# (raspberrypi4-64, raspberrypi5) — this layer does not define its own machine confs today
# (see conf/machine/ if/when a board override is ever needed).

# We are conforming to the Yocto "compatible layers" convention (BBPATH/BBFILES discovery).
BBPATH .= ":${LAYERDIR}"

# Recipe (.bb/.bbappend) discovery: every recipes-*/*/​*.bb{,append} under this layer.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-sentient"
BBFILE_PATTERN_meta-sentient = "^${LAYERDIR}/"
# Priority: higher than the upstream layers we override recipes/machines from (bbappends),
# but this is not itself a base layer — 6 is a conventional "product/BSP-adjacent" layer
# priority, above meta-raspberrypi's default (typically 5) so our bbappends win.
BBFILE_PRIORITY_meta-sentient = "6"

# Yocto release series this layer is written against and tested with.
# TODO(verify-at-build): confirm LAYERSERIES_COMPAT="wrynose" is still accepted by the
# pinned poky checkout at build time (it is the declared-compatible series per the plan's
# wrynose pin; Yocto enforces this against poky's DISTRO_VERSION/series at parse time).
LAYERSERIES_COMPAT_meta-sentient = "wrynose"

# Minimum BitBake version this layer's syntax assumes (wrynose ships BitBake 2.8).
# TODO(verify-at-build): confirm against the pinned poky's actual bitbake --version.
LAYERVERSION_meta-sentient = "1"

# Layer dependencies: recipes here bbappend/rely on core (poky), meta-raspberrypi (MACHINEs),
# meta-openembedded/meta-networking (mosquitto, nftables), and meta-security (KSPP + gates).
# TODO(verify-at-build): confirm exact LAYERDEPENDS collection names against each pinned
# layer's own conf/layer.conf (they are typically "core", "raspberrypi", "openembedded-layer",
# "networking-layer", "security").
LAYERDEPENDS_meta-sentient = "core raspberrypi openembedded-layer networking-layer security"
