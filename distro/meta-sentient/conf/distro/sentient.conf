# sentient.conf — the custom DISTRO for the Sentient METEOR Raspberry Pi image.
#
# Built as a minimal Yocto Linux userland (systemd init, no package manager, hardened
# defaults) running the existing bin-rpi std/tokio binary — see CLAUDE.md "Platform &
# Deployment" for why the Pi moved from bare Zephyr to this. MCU boards are unaffected
# (still Zephyr).
#
# This distro conf inherits poky's base distro policy and layers our identity/branding +
# hardening on top, rather than redefining policy from scratch.
require conf/distro/poky.conf

# --- Identity -----------------------------------------------------------------------
# DISTRO/DISTRO_NAME/DISTRO_VERSION/DISTRO_CODENAME identify this as OUR distro, distinct
# from vanilla poky or raspberrypi-oe, in `bitbake-getvar`, build logs, and os-release.
DISTRO = "sentient"
DISTRO_NAME = "Sentient METEOR"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "meteor"

# --- Init system: systemd, not sysvinit ----------------------------------------------
# The agent unit (recipes-sentient/sentient-agent) relies on systemd (Type=notify +
# sd-notify watchdog, sandboxing directives). INIT_MANAGER is the wrynose-era switch
# that also updates DISTRO_FEATURES/VIRTUAL-RUNTIME defaults for us; we still explicitly
# add "systemd" and drop "sysvinit" below for clarity/belt-and-braces.
INIT_MANAGER = "systemd"

# --- DISTRO_FEATURES ------------------------------------------------------------------
# Add: systemd (init/service manager, matches INIT_MANAGER above) and security (pulls in
# meta-security's hardening class/recipe set — KSPP kernel fragment, hardening checkers).
# Remove: sysvinit (we are systemd-only; no dual-init support needed, smaller image/attack
# surface) and x11 (headless comms-module device, no display server needed beyond psplash's
# own minimal framebuffer splash).
DISTRO_FEATURES:append = " systemd security"
DISTRO_FEATURES_OPTED_OUT:append = " sysvinit"
DISTRO_FEATURES:remove = "sysvinit x11"

VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_dev_manager = "systemd"
VIRTUAL-RUNTIME_login_manager = "shadow-base"

# --- Compiler/binary hardening (distro-wide) ------------------------------------------
# PIE, full RELRO+BIND_NOW, stack-protector-strong, FORTIFY_SOURCE for every recipe built
# from source in this distro (kernel excepted — see recipes-kernel/ for its own hardening
# path). bin-rpi itself is a prebuilt already-hardened static-PIE artifact and is not
# recompiled here; this .inc hardens the surrounding OS packages (busybox, mosquitto, etc).
require conf/distro/include/sentient-security-flags.inc

# --- Boot splash (branding) ------------------------------------------------------------
# psplash is Yocto's standard minimal boot-splash mechanism; our logo is supplied via a
# psplash bbappend (see recipes-core/psplash/ — added when the branding artwork lands;
# tracked as a follow-up to this recipe skeleton). SPLASH selects the splash provider and
# the "splash" MACHINE/DISTRO feature (pulled in per-machine, e.g. via meta-raspberrypi)
# is what actually wires it into the boot sequence.
SPLASH = "psplash"
DISTRO_FEATURES:append = " splash"

# --- os-release identity (boot/login banner + `cat /etc/os-release`) -------------------
# These feed the os-release recipe's PRETTY_NAME and friends; combined with the
# base-files bbappend (branded /etc/issue) this is the "boot/login text banner" branding
# requirement. NAME/VERSION here intentionally mirror DISTRO_NAME/DISTRO_VERSION above so
# there is exactly one place branding text is authored.
DISTRO_PRETTY_NAME = "${DISTRO_NAME} ${DISTRO_VERSION} (${DISTRO_CODENAME})"
# TODO(verify-at-build): confirm the exact os-release recipe variable poky/wrynose reads
# for PRETTY_NAME (it is typically driven from DISTRO_NAME/DISTRO_VERSION automatically,
# but some Yocto versions expose a dedicated OS_RELEASE_FIELDS/PRETTY_NAME override point —
# check meta/recipes-core/os-release/os-release.bb in the pinned poky checkout).

# --- Root lockdown ----------------------------------------------------------------------
# No debug-tweaks anywhere in this distro (see sentient-image.bb) means no empty root
# password / no auto root login is ever enabled by default; this is enforced at the image
# level, not here, but called out for visibility since it's part of the same hardening
# story as the DISTRO_FEATURES above.
