# Kernel config fragment — filesystems required for the systemd-sysext app extension.
#
# systemd-sysext.service overlays the app extension image (a squashfs .raw, see
# distro/meta-sentient/recipes-sentient/sentient-app-sysext/sentient-app-sysext.bb) onto /usr
# via overlayfs at EARLY boot (before basic.target). Build BOTH filesystems INTO the kernel
# (=y, not =m) so they're unconditionally present at that merge point on every target machine
# (qemuarm64 emulation + raspberrypi4-64/raspberrypi5 shipping) with no module-load ordering.
#
# SQUASHFS_XATTR is required because the sysext extension-release carries a `user.*` xattr
# (user.extension-release.strict) that systemd reads to accept a renamed .raw.
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
# systemd-sysext merges a raw filesystem image (our squashfs .raw) by setting up a LOOP device for
# it (systemd-dissect) and mounting it — so loop-device support must be built in, or the merge fails
# at boot with "systemd-sysext: Failed to read metadata for image <name>: No such file or directory"
# (it cannot set up /dev/loop* to read the image). Built-in (=y) so it's present at the early
# systemd-sysext.service point, before basic.target, with no module-load ordering.
CONFIG_BLK_DEV_LOOP=y
