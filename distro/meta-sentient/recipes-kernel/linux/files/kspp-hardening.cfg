# KSPP (Kernel Self Protection Project) hardening fragment — Sentient METEOR Yocto image.
#
# Reference: https://kspp.github.io/Recommended_Settings (living document; verify current
# recommendations at build time — this list is a point-in-time transcription, not a generated
# artifact). Merged into the kernel `.config` via `linux-yocto`'s SRC_URI fragment mechanism
# (see the `linux-yocto_%.bbappend` in this same directory).
#
# TODO(verify-at-build): confirm each symbol below actually exists (spelling + polarity) for the
# pinned Pi kernel version at build time — `bitbake -c menuconfig virtual/kernel` or
# `scripts/diffconfig` against the merged `.config`, and gate with `kernel-hardening-checker`
# (https://github.com/a13xp0p0v/kernel-hardening-checker) in CI per plan phase 1H item 5. Some
# symbols may be unavailable/renamed on a given kernel major version, or may already be forced by
# a defconfig the machine BSP provides — a merge_config warning is expected/OK if so; a silent
# non-apply is not (compare against the audit log).

# --- Compiler-assisted mitigations ---
CONFIG_FORTIFY_SOURCE=y
CONFIG_STACKPROTECTOR_STRONG=y

# --- Memory-region write/execute separation ---
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_STRICT_MODULE_RWX=y

# --- Address-space / stack-offset randomization ---
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y

# --- Allocator hardening ---
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_SLAB_FREELIST_RANDOM=y

# --- Copy-to/from-user bounds checking ---
CONFIG_HARDENED_USERCOPY=y

# --- Physical memory access lockdown ---
CONFIG_STRICT_DEVMEM=y
# CONFIG_DEVMEM is not set

# --- Kernel lockdown / LSM ---
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_YAMA=y

# --- NOT a CONFIG symbol: unprivileged BPF ---
# Unprivileged BPF is a runtime sysctl, not a kernel .config symbol:
#   kernel.unprivileged_bpf_disabled = 1
# This is set via a systemd-sysctl.d drop-in owned by another recipe/workstream (or documented as
# a manual first-boot step) — see distro/HARDENING.md's kernel-hardening checklist item, which
# cross-references this fragment and this sysctl together. Do NOT add it here; a .cfg fragment
# only ever merges into .config, it cannot set a runtime sysctl.
