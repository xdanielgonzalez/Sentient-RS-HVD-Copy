# Docs-site vhost — static mdbook output only. Plain HTTP :80: the Tailscale sidecar owns TLS
# (serve proxies https://sentient-docs.<tailnet>.ts.net -> 127.0.0.1:80), nothing else can reach
# this port (no Service/Ingress exposes it; see .ci/k8s/docs/deployment.yaml).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # The site is fully static and content-hashed where it matters (mdbook 0.5 hashes theme
    # assets); rustdoc under /api/ is not hashed — keep cache modest rather than immutable.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    expires 1h;

    location / {
        try_files $uri $uri/ =404;
    }
}
